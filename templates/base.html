<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Котокафе{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="{{ url_for('home') }}">
      <span class="logo-icon">🐾</span>
      <span class="logo-text">Котокафе</span>
    </a>
    <nav class="nav">
      <a href="{{ url_for('home') }}">Главная</a>
      <a href="{{ url_for('menu') }}">Меню</a>
      <a href="{{ url_for('cats') }}">Коты</a>
      <a href="{{ url_for('promotions') }}">Акции</a>
      <a href="{{ url_for('about') }}">О нас</a>
      <a href="{{ url_for('contacts') }}">Контакты</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div>
      {% if contact %}
        {{ contact.address }} ·
        {{ contact.phone }} ·
        {{ contact.email }}
      {% endif %}
    </div>
    <div class="socials">
      {% for s in social_links %}
        <a href="{{ s.url }}" target="_blank" rel="noopener">{{ s.name }}</a>
      {% endfor %}
    </div>
  </footer>
<script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</body>
</html>
