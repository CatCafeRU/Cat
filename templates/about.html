{% extends 'base.html' %}
{% block title %}О нас — Котокафе{% endblock %}
{% block content %}
<h1>{{ page.title }}</h1>
<div class="about-body">
  <p>{{ page.body }}</p>
</div>
<div class="about-images">
  {% if page.image %}
    <img src="{{ url_for('media', filename=page.image) }}" alt="Интерьер">
  {% endif %}
  {% if page.team_image %}
    <img src="{{ url_for('media', filename=page.team_image) }}" alt="Команда">
  {% endif %}
</div>
{% endblock %}
